name: Build
on:
  push:
  workflow_dispatch:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ESP32Servo
          mkdir -p src/GadRail
          cp GadRail.ino src/GadRail/
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --export-binaries src/GadRail
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: src/GadRail/build/**/*.bin
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter create --platforms=android --project-name gadrail build_app
          cp main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/><application#' $M
          sed -i 's#android:label="[^"]*"#android:label="GadRail"#' $M
          cd build_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: GadRail-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
